<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Portfolio Project</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 50px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; margin-top: 0; }
        .info-group { margin-bottom: 20px; }
        label { font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        .value { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 4px; color: #333; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; margin-right: 10px; }
        .btn-danger { background: #dc3545; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h2>My User Profile</h2>
        <div class="info-group">
            <label>Email Address:</label>
            <div class="value" id="user-email">Loading...</div>
        </div>
        <div class="info-group">
            <label>Assigned Role:</label>
            <div class="value" id="user-role">Loading...</div>
        </div>
        
        <a href="/dashboard.html" class="btn">Back to Dashboard</a>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>

    <script>
        async function fetchUserProfile() {
            const token = localStorage.getItem("access_token");
            if (!token) {
                window.location.href = "/"; // Agar token nahi hai toh login par bhej dein
                return;
            }

            try {
                const response = await fetch("/users/me", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById("user-email").innerText = data.email;
                    document.getElementById("user-role").innerText = data.role.toUpperCase();
                } else {
                    alert("Session expired. Please login again.");
                    logout();
                }
            } catch (error) {
                console.error("Error fetching profile:", error);
            }
        }

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");
            window.location.href = "/";
        }

        fetchUserProfile();
    </script>

</body>
</html>
